# Every push to main rebuilds the site and publishes it to Cloudflare Pages,
# so nobody has to upload a zip by hand.
#
# Needs two repository secrets, set once:
#   CLOUDFLARE_API_TOKEN  — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — the account id from the Cloudflare dashboard URL
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Notes and sources that never reach the public site.
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the pages
        run: node build.mjs

      - name: Collect what goes live
        run: node scripts/dist.mjs

      - name: Prepare verified image downloads
        run: node scripts/fetch-social-downloads.mjs

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=poetexa --branch=main

      - name: Verify all five live image downloads
        run: |
          node --input-type=module <<'JS'
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              for (let n = 1; n <= 5; n++) {
                const r = await fetch('https://poetexa.pages.dev/downloads/2026-10-29/post-' + n + '.jpg?check=' + process.env.GITHUB_SHA, { signal: AbortSignal.timeout(15000) });
                const data = new Uint8Array(await r.arrayBuffer());
                if (!r.ok || !r.headers.get('content-disposition')?.startsWith('attachment;') || data[0] !== 255 || data[1] !== 216 || data.length < 1000) throw new Error('Download ' + n + ' failed: HTTP ' + r.status);
                console.log('Live download ' + n + ': JPEG + attachment verified, ' + data.length + ' bytes');
              }
              process.exit(0);
            } catch (error) {
              if (attempt === 5) throw error;
              console.log(error.message + '; waiting for deployment propagation');
              await delay(5000);
            }
          }
          JS
