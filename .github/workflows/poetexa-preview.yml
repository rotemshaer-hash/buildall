name: POETEXA Branch Preview
on:
  push:
    branches:
      - design/poetexa-premium-preview
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all site pages
        run: node build.mjs
      - name: Prepare publish folder
        run: node scripts/dist.mjs
      - name: Verify preview files
        run: |
          test -s dist/index.html
          test -s dist/style.css
          test -s dist/assets/poetexa-wave.svg
      - name: Capture desktop and mobile screenshots
        run: |
          mkdir -p screenshots
          python3 -m http.server 8765 --directory dist >/tmp/poetexa-http.log 2>&1 &
          sleep 3
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            timeout 25s timeout 25s "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=screenshots/desktop.png http://127.0.0.1:8765/ || true
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=screenshots/mobile.png http://127.0.0.1:8765/ || true
          fi
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: poetexa-desktop-mobile-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload complete preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: poetexa-complete-site-preview
          path: dist/
          retention-days: 14
      - name: Deploy Cloudflare preview branch only
        env:
          PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.PREVIEW_TOKEN != '' && env.PREVIEW_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=buildall --branch=design-poetexa-premium-preview
