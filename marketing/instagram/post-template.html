<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Assistant:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{font-family:Assistant,Arial,sans-serif;position:relative;
    background:linear-gradient(135deg,#15274d 0%,#2b3d73 55%,#7550d4 100%);color:#fff}
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .g1{width:620px;height:620px;background:#7550d4;top:-180px;left:-160px}
  .g2{width:520px;height:520px;background:#2458cb;bottom:-200px;right:-140px}
  .wrap{position:relative;z-index:2;padding:80px;width:1080px;height:1080px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:14px}
  .mark{width:58px;height:58px;border-radius:16px;background:#ffffff1f;border:1px solid #ffffff40;display:grid;place-items:center}
  .mark svg{width:30px;height:30px}
  .brand{font:900 26px Rubik,sans-serif;letter-spacing:.02em}
  .badge{margin-right:auto;background:#ffffff20;border:1px solid #ffffff40;border-radius:999px;padding:10px 20px;font:800 16px Rubik,sans-serif;color:#dff5e8}
  .badge b{color:#7effc0;margin-left:6px}
  h1{font:900 66px/1.22 Rubik,sans-serif;margin-top:40px}
  h1 span{color:#c9b6ff}
  .lead{font-size:30px;line-height:1.6;color:#d7deff;max-width:820px;margin-top:26px}
  .bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .pills{display:flex;gap:12px;flex-wrap:wrap}
  .pill{background:#ffffff16;border:1px solid #ffffff33;border-radius:999px;padding:12px 22px;font:700 18px Assistant,sans-serif;color:#eef1ff}
  .cta{display:flex;align-items:center;gap:14px;background:#fff;color:#15274d;border-radius:999px;padding:16px 28px;font:800 24px Rubik,sans-serif}
  .cta b{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2458cb,#7550d4);color:#fff;display:grid;place-items:center;font-size:18px}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="wrap">
  <div class="top">
    <div class="mark"><svg viewBox="0 0 64 64"><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12 8 32l14 20"/><path d="M42 12l14 20-14 20"/></g><circle cx="32" cy="32" r="5" fill="#fff"/></svg></div>
    <span class="brand">POETE<span style="color:#c9b6ff">XA</span></span>
    <span class="badge"><b>●</b>{{KICKER}}</span>
  </div>

  <div>
    <h1>{{H1_LINE1}}<br>{{H1_LINE2_PREFIX}}<span>{{H1_LINE2_HIGHLIGHT}}</span>{{H1_LINE2_SUFFIX}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>

  <div class="bottom">
    <div class="pills">
      <span class="pill">{{PILL1}}</span>
      <span class="pill">{{PILL2}}</span>
      <span class="pill">{{PILL3}}</span>
    </div>
  </div>
  <div class="cta"><b>←</b><span>{{LINK}}</span></div>
</div>
</body>
</html>
