<!doctype html><html><head><meta charset="utf-8"><title>POETEXA internal visual QA</title><style>body{margin:0;background:#dfe4ef;font:14px Arial}nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,select,a{padding:8px}iframe{display:block;border:0;background:white;margin:0 10px}pre{white-space:pre-wrap;margin:12px}#gallery{display:grid;grid-template-columns:repeat(3,400px);gap:16px}.tile{width:400px;height:560px;overflow:hidden}.tile iframe{transform:scale(.26);transform-origin:top left;width:1440px;height:1900px}.tile b{display:block;padding:8px}</style></head><body><nav><select id="page"></select><select id="width"></select><button id="go">Open viewport</button><button id="full">Full page</button><button id="galleryBtn">All page gallery</button><button id="run">Audit all widths</button><button id="safe">Enable safe functional tests</button><button id="expand">Expand content</button></nav><pre id="result"></pre><iframe id="view" title="Site under review" width="390" height="1000" src="/"></iframe><div id="gallery"></div><script>
const pages=['/','/restaurants/','/beauty/','/retail/','/clinics/','/contractors/','/fitness/','/guides/','/guides/website-or-app/','/guides/shift-scheduling/','/guides/what-decides-price/','/guides/app-without-store/','/work/field-photos/','/work/employee-quiz/','/work/work-it/','/accessibility/','/privacy/','/404.html','/demo/cafe/','/demo/landing/','/demo/colors/','/demo/colors-blue/','/demo/colors10/','/demo/logo/','/demo/premium/','/demo/blueprint/','/demo/future/'];
const widths=[320,360,390,430,768,1440,1920];
const $=id=>document.getElementById(id);pages.forEach(p=>$('page').add(new Option(p,p)));widths.forEach(w=>$('width').add(new Option(w,w)));$('width').value='390';
function show(){ $('view').hidden=false;$('gallery').innerHTML='';$('view').width=$('width').value;$('view').height=1000;$('view').src=$('page').value; }
$('go').onclick=show;$('expand').onclick=()=>{$('view').contentDocument.querySelectorAll('details:not(.mobile-menu)').forEach(el=>el.open=true);};$('safe').onclick=()=>{const win=$('view').contentWindow;win.open=(url)=>{$('result').textContent='Captured WhatsApp URL: '+url;return null;};const orig=win.fetch.bind(win);win.fetch=(url,opts)=>{if(String(url).includes('/api/chat'))return Promise.resolve(new Response('{}',{status:503,headers:{'content-type':'application/json'}}));if(String(url).includes('web3forms'))throw new Error('Test harness prevents real mail');return orig(url,opts);};$('result').textContent='Safe functional tests enabled: external submissions disabled';};$('full').onclick=()=>{$('view').height=$('view').contentDocument.documentElement.scrollHeight;};
$('galleryBtn').onclick=()=>{ $('view').hidden=true;$('gallery').innerHTML='';for(const p of pages){const tile=document.createElement('div');tile.className='tile';const b=document.createElement('b');b.textContent=p;tile.append(b);const f=document.createElement('iframe');f.src=p;f.title=p;tile.append(f);$('gallery').append(tile);}};
$('run').onclick=async()=>{const report=[];$('result').textContent='Running…';for(const p of (new URLSearchParams(location.search).get('only') ? [new URLSearchParams(location.search).get('only')]:pages)){for(const w of widths){const f=$('view');f.width=w;await new Promise(resolve=>{f.onload=resolve;f.src=p;});await f.contentDocument.fonts.ready;const d=f.contentDocument;d.querySelectorAll('details:not(.mobile-menu)').forEach(el=>el.open=true);const visible=e=>e.getClientRects().length&&!e.closest('details:not([open]) :not(summary):not(summary *)');const bad=[...d.querySelectorAll('h1,h2,h3,.btn,summary')].filter(visible).filter(e=>e.scrollWidth>e.clientWidth+2).map(e=>e.className+':'+e.textContent.trim().slice(0,60));const imgs=[...d.images].filter(e=>!e.complete||!e.naturalWidth).map(e=>e.src);report.push({page:p,width:w,overflow:d.documentElement.scrollWidth>w,clipped:bad,images:imgs,h1:d.querySelectorAll('h1').length});$('result').textContent=`${report.length} / ${pages.length*widths.length}`;}}window.qaReport=report;$('result').textContent=JSON.stringify(report.filter(r=>r.overflow||r.clipped.length||r.images.length||r.h1!==1),null,2)+'\nChecked '+report.length+' page/viewports';};
</script></body></html>
